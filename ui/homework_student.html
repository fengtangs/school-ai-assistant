<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>校园小助手 · 我的作业</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root { --main:#185fa5; --main-dark:#124a80; --bg:#f1efe8; --card:#fff;
    --line:#d3d1c7; --text:#2c2c2a; --muted:#888780; --ok:#5dcaa5; --warn:#ef9f27; --err:#d14343; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg);
    color:var(--text); min-height:100vh; font-size:14px; line-height:1.6; }
  header { background:var(--main); color:#fff; padding:12px 20px; display:flex;
    align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    position:sticky; top:0; z-index:20; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  header h1 { font-size:16px; font-weight:500; }
  header .sub { font-size:12px; opacity:.85; margin-top:1px; }
  .link-btn { background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:8px;
    padding:6px 12px; font-size:12px; cursor:pointer; text-decoration:none; }
  .link-btn:hover { background:rgba(255,255,255,.28); }

  .wrap { max-width:760px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:.5px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card h2 { font-size:15px; font-weight:600; margin-bottom:12px; }

  .stu-bar { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .stu-bar .field { display:flex; flex-direction:column; gap:4px; }
  .stu-bar .field label { font-size:12px; color:#55534d; font-weight:500; }
  .stu-bar .field input, .stu-bar .field select { font-family:inherit; font-size:13px; padding:8px 10px;
    border-radius:8px; border:1px solid var(--line); background:#fff; }
  .stu-bar .field.name { flex:1; min-width:140px; }
  .stu-bar .field.sub { flex:1; min-width:140px; }

  .asg { display:flex; flex-direction:column; gap:10px; }
  .asg-item { border:.5px solid var(--line); border-radius:10px; padding:12px 14px; background:#fdfcf9; cursor:pointer; }
  .asg-item:hover { border-color:#9ab8d6; background:#eef5fc; }
  .asg-item .t { font-weight:600; font-size:14px; }
  .asg-item .m { font-size:12px; color:var(--muted); margin-top:3px; }
  .asg-item .go { float:right; font-size:12px; color:var(--main); }
  .empty { color:var(--muted); font-size:13px; text-align:center; padding:18px 0; }

  .q { border-bottom:.5px solid #eee; padding:14px 0; }
  .q:last-child { border-bottom:none; }
  .q .qh { font-weight:600; margin-bottom:8px; }
  .q .qno { display:inline-block; min-width:22px; height:22px; line-height:22px; text-align:center;
    background:var(--main); color:#fff; border-radius:6px; font-size:12px; margin-right:8px; }
  .q .qt { font-size:12px; color:var(--muted); margin-left:6px; }
  .opts label { display:block; padding:7px 10px; border:1px solid var(--line); border-radius:8px;
    margin-top:6px; cursor:pointer; font-size:13.5px; }
  .opts label:hover { background:#f0f6fc; }
  .opts input { margin-right:8px; }
  .judge label { display:inline-block; padding:7px 16px; border:1px solid var(--line); border-radius:8px;
    margin:6px 10px 0 0; cursor:pointer; }
  .short textarea { width:100%; font-family:inherit; font-size:13.5px; padding:9px 11px; margin-top:6px;
    border-radius:8px; border:1px solid var(--line); resize:vertical; min-height:70px; }

  .btn-primary { background:var(--main); color:#fff; border:none; border-radius:9px;
    padding:11px 26px; font-size:14px; font-weight:500; cursor:pointer; }
  .btn-primary:hover { background:var(--main-dark); }
  .btn-primary:disabled { background:#b9c9d8; cursor:not-allowed; }
  .btn-ghost { background:#fff; color:var(--main); border:1px solid var(--line); border-radius:9px;
    padding:9px 18px; font-size:13px; cursor:pointer; }
  .btn-ghost:hover { background:#f0f6fc; }
  .actions { display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; align-items:center; }

  /* 结果 */
  .score-big { text-align:center; padding:18px; border-radius:12px; margin-bottom:14px; }
  .score-big.pass { background:#e9f8f2; }
  .score-big.fail { background:#fdeaea; }
  .score-big .num { font-size:46px; font-weight:800; color:var(--main); }
  .score-big.fail .num { color:var(--err); }
  .score-big .lab { font-size:13px; color:var(--muted); }
  .res-item { border:.5px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; }
  .res-item.wrong { border-color:#f0c9c9; background:#fdf3f3; }
  .res-item.right { border-color:#bde7d8; background:#f3fbf7; }
  .res-item.review { border-color:#f0e0bc; background:#fdfaef; }
  .res-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .tag { font-size:11px; padding:2px 9px; border-radius:20px; }
  .tag.wrong { background:#fdeaea; color:#8c2b2b; }
  .tag.right { background:#e9f8f2; color:#0d5c43; }
  .tag.review { background:#fdf6e7; color:#7a5510; }
  .res-a { font-size:13px; margin-top:5px; }
  .res-a .k { color:var(--muted); }
  .res-ana { font-size:12.5px; color:#555; margin-top:5px; background:#faf8f2; padding:7px 10px; border-radius:8px; }
  .alert { border-radius:9px; padding:10px 12px; font-size:12.5px; margin-top:10px; }
  .alert.warn { background:#fdf6e7; color:#7a5510; border:.5px solid #f0e0bc; }
  /* —— 切屏检测：作答页监考条 —— */
  .monitor { display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:#f4f8fc; border:.5px solid #cfe0f0; border-radius:9px; padding:8px 12px;
    margin-bottom:12px; font-size:12.5px; transition:background .2s,border-color .2s; }
  .monitor.warn { background:#fdf6e7; border-color:#f0e0bc; }
  .monitor.bad { background:#fdeaea; border-color:#f0c9c9; }
  .mon-left { display:flex; align-items:center; gap:7px; color:#3d5a75; }
  .monitor.warn .mon-left { color:#7a5510; }
  .monitor.bad .mon-left { color:#8c2b2b; }
  .mon-dot { width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; }
  .monitor.warn .mon-dot { background:var(--warn); }
  .monitor.bad .mon-dot { background:var(--err); animation:blink 1.2s infinite; }
  .mon-pill { background:#fff; border:.5px solid var(--line); border-radius:20px;
    padding:2px 10px; color:#55534d; white-space:nowrap; font-size:12px; }
  .monitor.bad .mon-pill { color:var(--err); border-color:#f0c9c9; }
  @keyframes blink { 50% { opacity:.35; } }
  #toast { position:fixed; top:66px; left:50%; transform:translateX(-50%); z-index:60;
    background:#7a5510; color:#fff; border-radius:10px; padding:10px 16px; font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.22); display:none; max-width:90vw; line-height:1.5; }
  #toast.show { display:block; }
  #toast.err { background:#8c2b2b; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <div>
    <h1>🏫 校园小助手 · 我的作业</h1>
    <div class="sub">选择科目作业 · 在线作答 · 即时查看成绩与解析</div>
  </div>
  <a class="link-btn" href="/">← 返回校园问答</a>
</header>

<div class="wrap">
  <!-- 步骤1：身份 + 选科目 -->
  <div class="card" id="stepPick">
    <h2>① 填写信息并选择科目作业</h2>
    <div class="stu-bar">
      <div class="field name"><label>姓名 <span style="color:#d14343">*</span></label>
        <input id="stuName" placeholder="请输入你的姓名"></div>
      <div class="field"><label>班级</label>
        <input id="stuClass" placeholder="如：2026级人工智能1班"></div>
      <div class="field sub"><label>科目</label>
        <select id="subjSel"><option value="">全部科目</option></select></div>
    </div>
    <div style="margin-top:14px"><button class="btn-primary" id="pickBtn">查看作业</button></div>
    <div id="pickMsg"></div>
  </div>

  <!-- 步骤2：作业列表 -->
  <div class="card hidden" id="stepList">
    <h2>② 选择一份作业 <span class="hint" id="listHint" style="font-size:12px;color:var(--muted);font-weight:400"></span></h2>
    <div class="asg" id="asgList"></div>
    <div style="margin-top:12px"><button class="btn-ghost" id="backPick">← 重新选择</button></div>
  </div>

  <!-- 步骤3：作答 -->
  <div class="card hidden" id="stepDo">
    <h2 id="doTitle">作答</h2>
    <div class="monitor" id="monitor">
      <div class="mon-left"><span class="mon-dot"></span><span id="monText">作答中 · 请勿切换到其他页面</span></div>
      <div class="mon-pill" id="monSwitch">👁 切屏 0 次</div>
    </div>
    <div id="doMeta" style="font-size:12px;color:var(--muted);margin-bottom:10px"></div>
    <div id="doQuestions"></div>
    <div class="actions">
      <button class="btn-primary" id="submitBtn">提交作业</button>
      <button class="btn-ghost" id="backList">← 返回作业列表</button>
    </div>
    <div id="doMsg"></div>
    <div style="font-size:11.5px;color:#9a978c;margin-top:10px">
      作答期间会检测是否离开本页面（切换标签页、切到其他窗口）。切屏次数将随作业一起提交给老师，用于学习过程记录。
    </div>
  </div>

  <!-- 步骤4：结果 -->
  <div class="card hidden" id="stepResult">
    <h2>作答结果</h2>
    <div id="resultBox"></div>
    <div class="actions">
      <button class="btn-ghost" id="backList2">← 返回作业列表</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const stuName=$('#stuName'), stuClass=$('#stuClass'), subjSel=$('#subjSel');
const pickBtn=$('#pickBtn'), pickMsg=$('#pickMsg');
const stepPick=$('#stepPick'), stepList=$('#stepList'), stepDo=$('#stepDo'), stepResult=$('#stepResult');
const asgList=$('#asgList'), doQuestions=$('#doQuestions'), doTitle=$('#doTitle'), doMeta=$('#doMeta');
const submitBtn=$('#submitBtn'), doMsg=$('#doMsg'), resultBox=$('#resultBox');

let currentHw=null, preview=null;

/* —————————————— 切屏检测 ——————————————
 * 浏览器不允许网页知道"你打开了哪个软件"，但能感知本页是否还可见/有焦点：
 *   visibilitychange(hidden)  → 切到别的标签页、最小化、切到其他应用
 *   blur                     → 窗口失焦（点开别的窗口、地址栏、任务栏）
 * 两者会同时触发，所以用 900ms 去重，避免一次切屏被记成两次。
 * 只在"作答中"计数；离开的时间累计成 away_seconds 一并提交。
 */
let answering=false;      // 是否处于作答状态
let switchCount=0;        // 切屏次数
let awayMs=0;             // 累计离开时长（毫秒）
let awayStart=0;          // 本次离开的起始时间戳，0 表示当前在页内
let lastLeave=0;          // 上次判定离开的时间，用于去重
let toastTimer=null;

function toast(text, isErr){
  const t=$('#toast');
  if(!t) return;
  t.textContent=text;
  t.className='show'+(isErr?' err':'');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.className=''; }, 3600);
}

function paintMonitor(){
  const box=$('#monitor'), pill=$('#monSwitch'), txt=$('#monText');
  if(!box) return;
  box.className='monitor'+(switchCount>=3?' bad':(switchCount>0?' warn':''));
  pill.textContent='👁 切屏 '+switchCount+' 次';
  txt.textContent = switchCount===0
    ? '作答中 · 请勿切换到其他页面'
    : (switchCount>=3 ? '已多次离开作答页，记录将同步给老师'
                      : '离开过作答页，记录将同步给老师');
}

function resetMonitor(){
  switchCount=0; awayMs=0; awayStart=0; lastLeave=0;
  paintMonitor();
}

function onLeave(){
  if(!answering) return;
  const now=Date.now();
  if(now-lastLeave<900){          // 同一次切屏的重复事件
    if(!awayStart) awayStart=now;
    return;
  }
  lastLeave=now; awayStart=now; switchCount++;
  paintMonitor();
}

function onBack(){
  if(!answering || !awayStart) return;
  awayMs += Date.now()-awayStart;
  awayStart=0;
  toast(switchCount>=3
    ? '⚠️ 第 '+switchCount+' 次切屏已被记录，将同步给老师'
    : '检测到离开作答页，已记录第 '+switchCount+' 次切屏', switchCount>=3);
  paintMonitor();
}

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) onLeave(); else onBack();
});
window.addEventListener('blur', onLeave);
window.addEventListener('focus', onBack);

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function qtLabel(t){ return ({choice:'选择题',judge:'判断题',short:'简答题'})[t]||t; }
function showPickMsg(kind,text){ const cls=kind==='err'?'warn':'warn'; pickMsg.innerHTML=text?`<div class="alert warn">${escapeHtml(text)}</div>`:''; }

async function loadSubjects(){
  try{ const r=await fetch('/api/homework/subjects'); const d=await r.json();
    subjSel.innerHTML='<option value="">全部科目</option>';
    (d.subjects||[]).forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; subjSel.appendChild(o); });
  }catch(e){}
}

pickBtn.onclick=async ()=>{
  const name=stuName.value.trim();
  if(!name){ showPickMsg('err','请填写姓名'); stuName.focus(); return; }
  const subj=subjSel.value;
  pickMsg.innerHTML='';
  asgList.innerHTML='<div class="empty">加载中…</div>';
  try{
    const r=await fetch('/api/homework/assignments'+(subj?('?subject='+encodeURIComponent(subj)):''));
    const d=await r.json(); const items=d.assignments||[];
    if(!items.length){ asgList.innerHTML='<div class="empty">该科目暂无已布置的作业</div>'; }
    else{
      asgList.innerHTML='';
      items.forEach(a=>{
        const el=document.createElement('div'); el.className='asg-item';
        el.innerHTML=`<span class="go">开始作答 →</span>
          <div class="t">${escapeHtml(a.title)}</div>
          <div class="m">${escapeHtml(a.subject)} · ${a.question_count}题 · 满分${a.total_score}${a.assign_class?' · '+escapeHtml(a.assign_class):''}${a.deadline?' · 截止'+escapeHtml(a.deadline):''}</div>`;
        el.onclick=()=>openDo(a.id);
        asgList.appendChild(el);
      });
    }
    $('#listHint').textContent = subj?`（${subj}）`:'（全部科目）';
    stepPick.classList.add('hidden'); stepList.classList.remove('hidden');
  }catch(e){ asgList.innerHTML='<div class="empty">加载失败</div>'; }
};

$('#backPick').onclick=()=>{ stepList.classList.add('hidden'); stepPick.classList.remove('hidden'); };

async function openDo(id){
  try{
    const r=await fetch('/api/homework/preview/'+id); const d=await r.json(); if(!r.ok)throw new Error(d.detail);
    preview=d; currentHw=id;
    doTitle.textContent=d.title;
    doMeta.textContent=`${d.subject} · ${d.question_count}题 · 满分${d.total_score}${d.deadline?' · 截止'+d.deadline:''}`;
    doQuestions.innerHTML='';
    d.questions.forEach((q,i)=>doQuestions.appendChild(renderDoQ(q,i)));
    stepList.classList.add('hidden'); stepDo.classList.remove('hidden');
    doMsg.innerHTML='';
    answering=true;      // 进入作答，开始检测切屏
    resetMonitor();
  }catch(e){ alert('打开失败：'+e.message); }
}

function renderDoQ(q,i){
  const el=document.createElement('div'); el.className='q';
  let body='';
  if(q.type==='choice'){
    body=`<div class="opts">`+q.options.map((o,oi)=>
      `<label><input type="radio" name="q${i}" value="${oi}"> ${escapeHtml(o)}</label>`).join('')+`</div>`;
  } else if(q.type==='judge'){
    body=`<div class="judge"><label><input type="radio" name="q${i}" value="true"> 正确</label>
      <label><input type="radio" name="q${i}" value="false"> 错误</label></div>`;
  } else {
    body=`<div class="short"><textarea id="q${i}" placeholder="在此输入你的作答…"></textarea></div>`;
  }
  el.innerHTML=`<div class="qh"><span class="qno">${i+1}</span>${escapeHtml(q.stem)}<span class="qt">[${qtLabel(q.type)}]</span></div>${body}`;
  return el;
}

$('#backList').onclick=()=>{ answering=false; stepDo.classList.add('hidden'); stepList.classList.remove('hidden'); };

submitBtn.onclick=async ()=>{
  const answers={};
  let unanswered=0;
  preview.questions.forEach((q,i)=>{
    if(q.type==='short'){ const v=$('#q'+i).value.trim(); if(v) answers[i]=v; else unanswered++; }
    else { const r=document.querySelector(`input[name="q${i}"]:checked`);
      if(!r){ unanswered++; } else { answers[i]= q.type==='choice'?parseInt(r.value):(r.value==='true'); } }
  });
  if(unanswered>0 && !confirm(`还有 ${unanswered} 题未作答，确定提交？`)) return;
  // 切屏较多时再确认一次，让学生知道这条记录会跟着作业走
  if(switchCount>0 && !confirm(`本次作答期间检测到 ${switchCount} 次切屏（累计离开约 ${Math.round(awayMs/1000)} 秒），该记录会随作业提交给老师。\n\n仍要提交吗？`)) return;

  answering=false;     // 停止计数：提交过程中/结果页的切屏不算作答行为
  submitBtn.disabled=true; submitBtn.innerHTML='<span class="spinner"></span>提交批改中…';
  doMsg.innerHTML='';
  try{
    const r=await fetch('/api/homework/submit',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ homework_id:currentHw, student_name:stuName.value.trim(),
        student_class:stuClass.value.trim(), answers,
        switch_count:switchCount, away_seconds:Math.round(awayMs/1000) })});
    const d=await r.json(); if(!r.ok) throw new Error(d.detail||('HTTP '+r.status));
    renderResult(d);
    stepDo.classList.add('hidden'); stepResult.classList.remove('hidden');
  }catch(e){ doMsg.innerHTML=`<div class="alert warn">提交失败：${escapeHtml(e.message)}</div>`; }
  finally{ submitBtn.disabled=false; submitBtn.textContent='提交作业'; }
};

function renderResult(d){
  const pass=d.passed;
  const nSw=(d.switch_count!=null?d.switch_count:switchCount);
  const swSec=(d.away_seconds!=null?d.away_seconds:Math.round(awayMs/1000));
  const big=`<div class="score-big ${pass?'pass':'fail'}">
      <div class="num">${d.score}<span style="font-size:20px"> / ${d.total}</span></div>
      <div class="lab">${pass?'🎉 恭喜，及格啦！':'未及格，继续加油～'}${d.needs_review?'（含待教师批改的简答题）':''}</div>
    </div>`;
  const swHtml = nSw>0
    ? `<div class="alert warn" style="margin-bottom:14px">👁 本次作答共检测到 <b>${nSw}</b> 次切屏${swSec>0?`（累计离开约 ${swSec} 秒）`:''}，该记录已随作业一并提交给老师。</div>`
    : '';
  const items=d.detail.map((q,i)=>{
    let cls='right', tag='<span class="tag right">答对</span>';
    if(q.needs_review){ cls='review'; tag='<span class="tag review">待批改</span>'; }
    else if(!q.correct){ cls='wrong'; tag='<span class="tag wrong">答错</span>'; }
    let ansShow='';
    if(q.type==='choice'){
      const stu=q.student_answer!=null?q.options[q.student_answer]:'（未答）';
      const corr=q.options[q.correct_answer];
      ansShow=`<div class="res-a"><span class="k">你的答案：</span>${escapeHtml(stu)}</div>
        <div class="res-a"><span class="k">正确答案：</span>${escapeHtml(corr)}</div>`;
    } else if(q.type==='judge'){
      const tf=v=>v===true?'正确':(v===false?'错误':'（未答）');
      ansShow=`<div class="res-a"><span class="k">你的答案：</span>${tf(q.student_answer)}</div>
        <div class="res-a"><span class="k">正确答案：</span>${tf(q.correct_answer)}</div>`;
    } else {
      ansShow=`<div class="res-a"><span class="k">你的作答：</span>${escapeHtml(q.student_answer||'（未答）')}</div>
        <div class="res-a"><span class="k">参考答案：</span>${escapeHtml(q.reference)}</div>`;
    }
    const ana=q.analysis?`<div class="res-ana">解析：${escapeHtml(q.analysis)}</div>`:'';
    return `<div class="res-item ${cls}">
      <div class="res-head"><span class="qno">${i+1}</span><b>${escapeHtml(q.stem)}</b> ${tag}
        <span style="margin-left:auto;font-size:12px;color:var(--muted)">${qtLabel(q.type)} · 得分 ${q.score}/${q.max}</span></div>
      ${ansShow}${ana}</div>`;
  }).join('');
  resultBox.innerHTML=big+swHtml+items;
}
$('#backList2').onclick=()=>{ stepResult.classList.add('hidden'); stepList.classList.remove('hidden'); };

(async ()=>{ await loadSubjects(); })();
</script>
