<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>校园AI问答助手（多智能体）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f1efe8; color: #2c2c2a; height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    background: #185fa5; color: #fff; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  header h1 { font-size: 16px; font-weight: 500; }
  header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  .head-right { display: flex; align-items: center; gap: 14px; }
  .link-btn { background: rgba(255,255,255,.16); color: #fff; border: none; border-radius: 8px;
    padding: 6px 12px; font-size: 12px; cursor: pointer; text-decoration: none; }
  .link-btn:hover { background: rgba(255,255,255,.28); }
  .agent-pick { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .agent-pick select {
    font-size: 13px; padding: 4px 8px; border-radius: 8px; border: none;
    background: #fff; color: #185fa5; cursor: pointer; max-width: 220px;
  }
  .status { font-size: 12px; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.ok { background: #5dcaa5; }
  .dot.warn { background: #ef9f27; }
  .wrap { flex: 1; display: flex; flex-direction: column; max-width: 820px; margin: 0 auto; width: 100%; padding: 16px; }
  #messages { flex: 1; overflow-y: auto; padding: 8px; }
  .msg { margin: 10px 0; max-width: 88%; }
  .msg.user { margin-left: auto; }
  .msg .bubble {
    padding: 10px 14px; border-radius: 12px; line-height: 1.6; font-size: 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.bot .bubble { background: #fff; border: .5px solid #d3d1c7; border-top-left-radius: 4px; }
  .msg.user .bubble { background: #185fa5; color: #fff; border-top-right-radius: 4px; }
  .src { font-size: 12px; color: #888780; margin-top: 4px; }
  /* 思考过程折叠块 */
  .think {
    background: #faf8f2; border: .5px solid #e3e0d4; border-radius: 10px;
    margin-bottom: 8px; padding: 6px 10px;
  }
  .think summary {
    cursor: pointer; font-size: 12px; color: #185fa5; user-select: none;
    list-style: none; outline: none;
  }
  .think summary::-webkit-details-marker { display: none; }
  .think summary::before { content: "▸ "; }
  .think[open] summary::before { content: "▾ "; }
  .think-body {
    margin-top: 6px; line-height: 1.55; font-size: 12.5px; color: #7a776c;
    font-style: italic; max-height: 260px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-word;
  }
  .think .think-done { font-style: normal; color: #9a978c; }
  .inputbar { display: flex; gap: 8px; padding: 10px; background: #fff; border: .5px solid #d3d1c7; border-radius: 12px; }
  .inputbar textarea {
    flex: 1; border: none; resize: none; outline: none; font-size: 14px;
    font-family: inherit; max-height: 120px; line-height: 1.5;
  }
  .inputbar button {
    border: .5px solid #185fa5; background: #185fa5; color: #fff;
    border-radius: 8px; padding: 0 18px; font-size: 14px; cursor: pointer;
  }
  .inputbar button:disabled { opacity: .5; cursor: default; }
  .toolbar { padding: 6px 8px; font-size: 12px; color: #888780; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .toolbar a, .toolbar button { color: #185fa5; cursor: pointer; background: none; border: none; font-size: 12px; }
  .toolbar button:disabled { color: #b9b6aa; cursor: default; text-decoration: line-through; }
  .toolbar .spacer { flex: 1; }

  /* ===== 空状态：悬浮问题卡片 ===== */
  #messages.vcenter { display: flex; flex-direction: column; justify-content: center; }
  #messages.vcenter #welcome { width: 100%; }
  #welcome { padding: 4px 2px 16px; }
  .wel-hero { display: flex; align-items: center; gap: 16px; margin: 18px 0 22px; }
  .wel-avatar {
    width: 58px; height: 58px; flex: none; border-radius: 18px; display: grid; place-items: center;
    font-size: 28px; background: #fff; border: .5px solid #d3d1c7;
    box-shadow: 0 10px 24px rgba(24,95,165,.14);
    animation: floaty 7s ease-in-out infinite;
  }
  .wel-hero h2 { font-size: 20px; font-weight: 600; letter-spacing: .2px; }
  .wel-hero p { font-size: 13px; color: #888780; margin-top: 5px; line-height: 1.5; }
  .wel-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 2px; }
  .wel-bar span { font-size: 12px; color: #888780; letter-spacing: .3px; }
  .wel-more {
    font-size: 12px; color: #185fa5; background: rgba(24,95,165,.08); border: none;
    border-radius: 999px; padding: 5px 12px; cursor: pointer; font-family: inherit;
  }
  .wel-more:hover { background: rgba(24,95,165,.16); }
  .wel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 10px; }
  .qcard {
    display: flex; align-items: flex-start; gap: 10px; text-align: left; width: 100%;
    background: #fff; border: .5px solid #d3d1c7; border-radius: 14px;
    padding: 12px 13px; cursor: pointer; font-family: inherit; color: #2c2c2a;
    box-shadow: 0 4px 14px rgba(44,44,42,.05);
    transition: box-shadow .2s, border-color .2s, background .2s;
    animation: fadeIn .5s both, floaty 8s ease-in-out infinite;
  }
  .qcard:hover, .qcard:focus-visible {
    animation-play-state: paused;
    border-color: #185fa5; background: #fdfdff;
    box-shadow: 0 12px 28px rgba(24,95,165,.16);
    outline: none;
  }
  .qc-ic { font-size: 17px; line-height: 1.15; flex: none; }
  .qc-q {
    flex: 1; font-size: 13.2px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .qc-go { font-size: 12px; color: #b9b6aa; flex: none; margin-top: 1px; transition: color .2s, transform .2s; }
  .qcard:hover .qc-go { color: #185fa5; transform: translateX(2px); }
  .wel-foot { margin-top: 16px; font-size: 11.5px; color: #9a978c; line-height: 1.6; }
  .wel-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .wel-links a {
    font-size: 12px; text-decoration: none; color: #185fa5; background: #fff;
    border: .5px solid #d3d1c7; border-radius: 999px; padding: 6px 12px;
    transition: border-color .18s, box-shadow .18s, transform .18s;
  }
  .wel-links a:hover {
    border-color: #185fa5; box-shadow: 0 6px 16px rgba(24,95,165,.14); transform: translateY(-1px);
  }
  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ===== 悬浮：常见问答 ===== */
  .faq-fab {
    position: fixed; right: 22px; bottom: 26px; z-index: 40; font-family: inherit;
    display: flex; align-items: center; gap: 7px; font-size: 13px;
    background: #185fa5; color: #fff; border: none; border-radius: 999px; padding: 11px 17px;
    cursor: pointer; box-shadow: 0 10px 26px rgba(24,95,165,.34);
    transition: transform .18s, box-shadow .18s, background .18s;
  }
  .faq-fab:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(24,95,165,.42); background: #14508c; }
  .faq-fab .badge {
    background: rgba(255,255,255,.24); border-radius: 999px; font-size: 11px; padding: 1px 6px;
  }
  .faq-panel {
    position: fixed; right: 22px; bottom: 80px; z-index: 41;
    width: min(384px, calc(100vw - 32px)); max-height: min(64vh, 540px);
    background: #fff; border: .5px solid #d3d1c7; border-radius: 16px;
    box-shadow: 0 20px 52px rgba(44,44,42,.2); display: none; flex-direction: column; overflow: hidden;
  }
  .faq-panel.open { display: flex; animation: popIn .2s ease-out; }
  @keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  .faq-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px 10px; border-bottom: .5px solid #eeece3;
  }
  .faq-head b { font-size: 14px; font-weight: 600; }
  .faq-head span { font-size: 11.5px; color: #9a978c; margin-left: 6px; font-weight: 400; }
  .faq-x {
    border: none; background: #f4f2ec; color: #7a776c; width: 24px; height: 24px;
    border-radius: 8px; cursor: pointer; font-size: 13px; line-height: 1; font-family: inherit;
  }
  .faq-x:hover { background: #e8e5db; }
  .faq-search { padding: 9px 14px; border-bottom: .5px solid #eeece3; }
  .faq-search input {
    width: 100%; border: .5px solid #dedcd2; border-radius: 9px; padding: 7px 10px;
    font-size: 12.5px; font-family: inherit; outline: none; background: #faf9f4;
  }
  .faq-search input:focus { border-color: #185fa5; background: #fff; }
  .faq-body { overflow-y: auto; padding: 6px 8px 10px; }
  .fg-t {
    font-size: 11.5px; color: #9a978c; letter-spacing: .4px;
    padding: 10px 8px 5px; display: flex; align-items: center; gap: 6px;
  }
  .fq {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: none; font-family: inherit; color: #2c2c2a;
    font-size: 12.8px; line-height: 1.45; padding: 8px 9px; border-radius: 9px; cursor: pointer;
  }
  .fq:hover { background: rgba(24,95,165,.08); color: #14508c; }
  .fq .arr { margin-left: auto; color: #c9c6ba; font-size: 12px; }
  .fq:hover .arr { color: #185fa5; }
  .faq-empty { padding: 18px; text-align: center; font-size: 12.5px; color: #9a978c; }

  /* 回答复制按钮 */
  .msg { position: relative; width: fit-content; }
  .copy {
    position: absolute; top: 5px; right: 5px; opacity: 0; transition: opacity .18s;
    font-size: 11px; font-family: inherit; color: #888780; background: #fff;
    border: .5px solid #d3d1c7; border-radius: 6px; padding: 2px 7px; cursor: pointer;
    box-shadow: 0 2px 6px rgba(44,44,42,.08);
  }
  .msg.bot:hover .copy { opacity: 1; }
  .copy:hover { color: #185fa5; border-color: #185fa5; }

  @media (max-width: 720px) {
    header { flex-wrap: wrap; padding: 10px 12px; row-gap: 10px; }
    header h1 { font-size: 15px; white-space: nowrap; }
    header .sub { display: none; }
    .head-right { width: 100%; flex-wrap: wrap; gap: 8px; }
    .agent-pick select { max-width: 150px; }
    .status { font-size: 11px; flex: none; }
    .status span:not(.dot) { display: none; }   /* 窄屏只留连接状态圆点，避免撑出横向滚动 */
    .wrap { padding: 10px; }
    #faqTool { display: none; }
    .faq-fab { right: 14px; bottom: 84px; padding: 10px 14px; font-size: 12px; }
    .faq-panel { right: 12px; left: 12px; width: auto; bottom: 132px; max-height: 62vh; }
    .wel-grid { grid-template-columns: 1fr; }
    .wel-hero h2 { font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .qcard, .wel-avatar { animation: none !important; }
    .faq-panel.open { animation: none; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>校园AI问答助手</h1>
    <div class="sub">本地大模型驱动 · 多智能体 RAG</div>
  </div>
  <div class="head-right">
    <a class="link-btn" href="/homework/student" target="_blank">📚 我的作业</a>
    <div class="agent-pick">
      <span>智能体</span>
      <select id="agentSel"></select>
    </div>
    <div class="agent-pick" id="modelPick">
      <span>模型</span>
      <select id="modelSel"></select>
    </div>
    <div class="status" id="status"><span class="dot warn"></span><span>连接中…</span></div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <a href="/docs" target="_blank">API 文档</a>
    <a href="/teacher" target="_blank">👩‍🏫 教师工作台</a>
    <button id="rebuild">重建当前智能体知识库</button>
    <span class="spacer"></span>
    <button id="faqTool" type="button">💡 常见问答</button>
  </div>
  <div id="messages">
    <div id="welcome"></div>
  </div>
  <div class="inputbar">
    <textarea id="input" rows="1" placeholder="输入你的问题…"></textarea>
    <button id="send">发送</button>
  </div>
</div>

<button class="faq-fab" id="faqFab" type="button" aria-haspopup="dialog">
  <span>💡</span><span>常见问答</span><span class="badge" id="faqCount">0</span>
</button>

<div class="faq-panel" id="faqPanel" role="dialog" aria-label="常见问答">
  <div class="faq-head">
    <div><b>常见问答</b><span id="faqScope"></span></div>
    <button class="faq-x" id="faqClose" type="button" aria-label="关闭">✕</button>
  </div>
  <div class="faq-search"><input id="faqQuery" type="text" placeholder="搜索问题，如：宿舍、奖学金、认证…" /></div>
  <div class="faq-body" id="faqBody"></div>
</div>

<script>

const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const agentSel = document.getElementById('agentSel');
const modelSel = document.getElementById('modelSel');
const modelPick = document.getElementById('modelPick');

let agents = [];
let currentAgent = null;
let models = [];
let currentModel = null;   // null = 跟随 .env 配置的默认模型

function faqFor(agentId) {
  return FAQ_DATA[agentId] || FAQ_DATA.campus;
}

const welcomeEl = document.getElementById('welcome');
const faqFab = document.getElementById('faqFab');
const faqPanel = document.getElementById('faqPanel');
const faqBody = document.getElementById('faqBody');
const faqQuery = document.getElementById('faqQuery');

let faqFlat = [];   // [{q, icon}]

function hideWelcome() {
  if (welcomeEl && welcomeEl.style.display !== 'none') {
    welcomeEl.style.display = 'none';
    messages.classList.remove('empty', 'vcenter');
  }
}

function fitCenter() {
  const isEmpty = !messages.querySelector('.msg');
  messages.classList.toggle('empty', isEmpty);
  if (!isEmpty) { messages.classList.remove('vcenter'); return; }
  // 内容装得下才垂直居中，装不下就顶部对齐，避免溢出被裁切
  messages.classList.toggle('vcenter', messages.scrollHeight <= messages.clientHeight + 2);
}
window.addEventListener('resize', () => setTimeout(fitCenter, 80));

function askQuestion(q) {
  if (!q) return;
  input.value = q;
  closeFaq();
  send();
}

/* ---- 空状态：悬浮问题卡片 ---- */
function pickRandom(list, n) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, Math.min(n, a.length));
}

function renderWelcome() {
  if (!welcomeEl) return;
  const d = faqFor(currentAgent);
  const name = (agents.find(a => a.id === currentAgent) || {}).name || '助手';
  const all = [];
  d.groups.forEach(g => g.items.forEach(q => all.push({ q, icon: g.icon })));
  faqFlat = all;

  welcomeEl.style.display = messages.querySelector('.msg') ? 'none' : '';
  welcomeEl.innerHTML =
    '<div class="wel-hero">'
    +   '<div class="wel-avatar">' + d.icon + '</div>'
    +   '<div><h2>' + d.greet + '</h2><p>' + name + ' · ' + d.hint + '</p></div>'
    + '</div>'
    + '<div class="wel-bar"><span>你可以这样问</span>'
    +   '<button class="wel-more" type="button" id="welMore">换一批 ↻</button></div>'
    + '<div class="wel-grid" id="welGrid"></div>'
    + '<div class="wel-links">'
    +   '<a href="/homework/student" target="_blank">📚 我的作业</a>'
    +   '<a href="/homework/teacher" target="_blank">📝 作业与学情</a>'
    +   '<a href="/teacher" target="_blank">👩‍🏫 教师工作台</a>'
    +   '<a href="/docs" target="_blank">📄 API 文档</a>'
    + '</div>'
    + '<div class="wel-foot">💡 点卡片直接提问 · Enter 发送 / Shift + Enter 换行 · 回答严格基于知识库，未覆盖时会如实告知</div>';

  paintCards();
  setTimeout(fitCenter, 30);
  const more = document.getElementById('welMore');
  if (more) more.onclick = paintCards;
}

function paintCards() {
  const grid = document.getElementById('welGrid');
  if (!grid) return;
  const picks = pickRandom(faqFlat, 6);
  grid.innerHTML = picks.map((it, i) =>
    '<button class="qcard" type="button" style="animation-delay:'
    + (i * 70) + 'ms,' + (-i * 0.8) + 's">'
    + '<span class="qc-ic">' + it.icon + '</span>'
    + '<span class="qc-q">' + it.q + '</span>'
    + '<span class="qc-go">→</span>'
    + '</button>'
  ).join('');
  grid.querySelectorAll('.qcard').forEach((el, i) => {
    el.onclick = () => askQuestion(picks[i].q);
  });
}

/* ---- 悬浮面板：常见问答 ---- */
function renderFaqPanel() {
  const d = faqFor(currentAgent);
  const name = (agents.find(a => a.id === currentAgent) || {}).name || '助手';
  const scope = document.getElementById('faqScope');
  if (scope) scope.textContent = '· ' + name;
  const badge = document.getElementById('faqCount');
  if (badge) badge.textContent = faqFlat.length;

  const kw = (faqQuery.value || '').trim().toLowerCase();
  let html = '';
  let shown = 0;
  d.groups.forEach(g => {
    const hit = g.items.filter(q => !kw || q.toLowerCase().includes(kw));
    if (!hit.length) return;
    shown += hit.length;
    html += '<div class="fg"><div class="fg-t"><span>' + g.icon + '</span>' + g.title + '</div>';
    hit.forEach(q => {
      html += '<button class="fq" type="button" data-q="' + q.replace(/"/g, '&quot;') + '">'
        + '<span>' + q + '</span><span class="arr">›</span></button>';
    });
    html += '</div>';
  });
  faqBody.innerHTML = shown ? html
    : '<div class="faq-empty">没有匹配的问题，换个关键词试试，或者直接在下方输入框提问。</div>';

  faqBody.querySelectorAll('.fq').forEach(el => {
    el.onclick = () => askQuestion(el.dataset.q);
  });
}

function openFaq() {
  if (!faqPanel) return;
  faqPanel.classList.add('open');
  faqQuery.value = '';
  renderFaqPanel();
  setTimeout(() => faqQuery.focus(), 60);
}

function closeFaq() {
  if (faqPanel) faqPanel.classList.remove('open');
}

if (faqFab) faqFab.onclick = () => {
  faqPanel.classList.contains('open') ? closeFaq() : openFaq();
};
const faqCloseBtn = document.getElementById('faqClose');
if (faqCloseBtn) faqCloseBtn.onclick = closeFaq;
const faqToolBtn = document.getElementById('faqTool');
if (faqToolBtn) faqToolBtn.onclick = openFaq;
if (faqQuery) faqQuery.oninput = renderFaqPanel;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && faqPanel.classList.contains('open')) closeFaq();
});
document.addEventListener('click', e => {
  if (!faqPanel.classList.contains('open')) return;
  if (faqPanel.contains(e.target) || faqFab.contains(e.target) || e.target === faqToolBtn) return;
  closeFaq();
});

function addMsg(role, text, sources) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  if (sources && sources.length) {
    const src = document.createElement('div');
    src.className = 'src';
    src.textContent = '参考来源：' + sources.join('、');
    wrap.appendChild(src);
  }
  messages.appendChild(wrap);
  messages.scrollTop = messages.scrollHeight;
  hideWelcome();
  if (role === 'bot') addCopyBtn(wrap);
  return wrap;
}

function addCopyBtn(wrap) {
  const btn = document.createElement('button');
  btn.className = 'copy';
  btn.type = 'button';
  btn.textContent = '复制';
  btn.title = '复制这条回答';
  btn.onclick = async (ev) => {
    ev.stopPropagation();
    const bubble = wrap.querySelector('.bubble');
    const text = bubble ? bubble.textContent : '';
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = '已复制';
    } catch (e) {
      btn.textContent = '复制失败';
    }
    setTimeout(() => { btn.textContent = '复制'; }, 1400);
  };
  wrap.appendChild(btn);
}

async function loadAgents() {
  try {
    const r = await fetch('/api/agents');
    const d = await r.json();
    agents = d.agents || [];
    currentAgent = d.default || (agents[0] && agents[0].id);
    agentSel.innerHTML = '';
    agents.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = (a.icon || '🤖') + ' ' + a.name;
      if (a.id === currentAgent) opt.selected = true;
      agentSel.appendChild(opt);
    });
    input.placeholder = '向「' + (agents.find(a => a.id === currentAgent) || {}).name + '」提问…';
  } catch (e) {
    agents = [];
  }
  renderWelcome();
  renderFaqPanel();
}

async function loadModels() {
  try {
    const r = await fetch('/api/models');
    const d = await r.json();
    // 只有 custom 后端才支持运行时切换模型；否则隐藏选择器
    if (!d.switchable || !(d.models || []).length) {
      if (modelPick) modelPick.style.display = 'none';
      return;
    }
    models = d.models;
    currentModel = d.current || null;
    modelSel.innerHTML = '';
    // 若配置的默认模型不在精选列表内，补一项以便正确回显
    if (currentModel && !models.some(m => m.id === currentModel)) {
      const opt = document.createElement('option');
      opt.value = currentModel;
      opt.textContent = currentModel + '（配置默认）';
      opt.selected = true;
      modelSel.appendChild(opt);
    }
    models.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.label + (m.note ? ' · ' + m.note : '');
      opt.title = m.note || m.id;
      if (m.id === currentModel) opt.selected = true;
      modelSel.appendChild(opt);
    });
  } catch (e) {
    if (modelPick) modelPick.style.display = 'none';
  }
}

async function checkHealth() {
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    const me = (d.agents || []).find(a => a.id === currentAgent) || {};
    const chunks = me.indexed_chunks != null ? me.indexed_chunks : (d.indexed_chunks || 0);
    const ready = me.llm_ready != null ? me.llm_ready : d.llm_ready;
    const name = (agents.find(a => a.id === currentAgent) || {}).name || '助手';
    // 教师助手的能力在独立工作台（上传资料 + 生成文件），这里给出引导
    if (currentAgent === 'teacher') {
      statusEl.innerHTML = '<span class="dot ok"></span><span>教师助手 · '
        + '<a href="/teacher" target="_blank" style="color:#fff;text-decoration:underline">打开教师工作台 →</a></span>';
      const rebuildBtn0 = document.getElementById('rebuild');
      if (rebuildBtn0) rebuildBtn0.disabled = true;
      return;
    }
    if (ready) {
      statusEl.innerHTML = '<span class="dot ok"></span><span>' + name + ' · 已连接本地大模型 · 索引 ' + chunks + ' 条</span>';
    } else {
      statusEl.innerHTML = '<span class="dot warn"></span><span>' + name + ' · 大模型未就绪 · 索引 ' + chunks + ' 条</span>';
    }
    // 无 RAG 的智能体（如“原始 DeepSeek”）没有知识库，禁用重建按钮
    const rebuildBtn = document.getElementById('rebuild');
    if (rebuildBtn) rebuildBtn.disabled = (me.rag === false);
  } catch (e) {
    statusEl.innerHTML = '<span class="dot warn"></span><span>服务未启动</span>';
  }
}

async function send() {
  const q = input.value.trim();
  if (!q) return;
  addMsg('user', q);
  input.value = '';
  sendBtn.disabled = true;

  // 流式消息占位（先显示思考中，待首个 delta 覆盖）
  const { bubble, src, thinkBox, thinkBody, thinkSummary } = addStreamMsg('思考中…');
  let full = '';
  let sources = [];

  function handleEvent(d) {
    if (d.type === 'meta') {
      sources = d.sources || [];
      if (sources.length) src.textContent = '参考来源：' + sources.join('、');
    } else if (d.type === 'thinking') {
      // 首个思考 token 到达：把占位文案从“思考中…”切到思考块
      thinkBody.textContent += d.text;
      messages.scrollTop = messages.scrollHeight;
    } else if (d.type === 'delta') {
      full += d.text;
      bubble.textContent = full;
      messages.scrollTop = messages.scrollHeight;
    } else if (d.type === 'done') {
      full = d.answer;
      bubble.textContent = full;
      messages.scrollTop = messages.scrollHeight;
      // 思考过程为空（如非推理模型/问题未触发思考）则隐藏整块
      if (!thinkBody.textContent.trim()) {
        thinkBox.style.display = 'none';
      } else {
        thinkSummary.textContent = '💭 模型思考过程';
      }
    } else if (d.type === 'error') {
      bubble.textContent = '出错了：' + d.message;
    }
  }

  try {
    const r = await fetch('/api/chat?stream=true', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        question: q,
        agent: currentAgent,
        model: currentModel || null
      })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      // 按 SSE 事件边界（空行）切分
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const raw = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        raw.split('\n').forEach(line => {
          if (!line.startsWith('data:')) return;
          const payload = line.slice(5).trim();
          if (!payload) return;
          try { handleEvent(JSON.parse(payload)); } catch (e) {}
        });
      }
    }
    // 处理末尾残留（无结束空行时）
    buf.split('\n').forEach(line => {
      if (!line.startsWith('data:')) return;
      const payload = line.slice(5).trim();
      if (!payload) return;
      try { handleEvent(JSON.parse(payload)); } catch (e) {}
    });
  } catch (e) {
    if (!full) bubble.textContent = '请求失败：' + e.message;
  } finally {
    sendBtn.disabled = false;
    checkHealth();
  }
}

function addStreamMsg(text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';

  // 思考过程（可折叠，随 thinking 事件实时追加）
  const thinkBox = document.createElement('details');
  thinkBox.className = 'think';
  thinkBox.open = true;
  const thinkSummary = document.createElement('summary');
  thinkSummary.textContent = '💭 模型思考过程（实时）';
  const thinkBody = document.createElement('div');
  thinkBody.className = 'think-body';
  thinkBox.appendChild(thinkSummary);
  thinkBox.appendChild(thinkBody);

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  const src = document.createElement('div');
  src.className = 'src';

  wrap.appendChild(thinkBox);
  wrap.appendChild(bubble);
  wrap.appendChild(src);
  addCopyBtn(wrap);
  messages.appendChild(wrap);
  messages.scrollTop = messages.scrollHeight;
  hideWelcome();
  return { wrap, bubble, src, thinkBox, thinkBody, thinkSummary };
}

agentSel.onchange = () => {
  currentAgent = agentSel.value;
  const a = agents.find(x => x.id === currentAgent);
  input.placeholder = '向「' + (a ? a.name : '助手') + '」提问…';
  renderWelcome();          // 切换智能体后空状态问题卡片跟着换
  renderFaqPanel();
  checkHealth();
};

modelSel.onchange = () => {
  currentModel = modelSel.value || null;
};

sendBtn.onclick = send;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('rebuild').onclick = async () => {
  addMsg('bot', '正在重建「' + (agents.find(a => a.id === currentAgent) || {}).name + '」知识库，请稍候…');
  const r = await fetch('/api/rebuild', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ agent: currentAgent })
  });
  const d = await r.json();
  addMsg('bot', '知识库已更新，共索引 ' + (d.indexed_chunks != null ? d.indexed_chunks : JSON.stringify(d.agents)) + ' 个片段。');
  checkHealth();
};
(async () => { await loadAgents(); await loadModels(); await checkHealth(); })();
</script>
